services:
  api:
    image: ghcr.io/podpeedami/converterdv:latest
    build: .
    container_name: video-api

    environment:
      - REDIS_URL=redis://redis:6379/0
      - MAX_UPLOAD_SIZE=10G # Maximum upload size

    volumes:
      - ./data:/data # Input/output video files

    ports:
      - "8090:8000" # Web interface: http://localhost:8080

    depends_on:
      - redis

    restart: unless-stopped

  worker:
    image: ghcr.io/podpeedami/converterdv:latest
    container_name: video-worker

    command: >
      celery
      -A app.celery_app.celery_app
      worker
      --loglevel=info
      --concurrency=2

    environment:
      - REDIS_URL=redis://redis:6379/0

    volumes:
      - ./data:/data # Input/output video files

    depends_on:
      - redis

    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: video-redis

    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

    restart: unless-stopped

volumes:
  redis_data: